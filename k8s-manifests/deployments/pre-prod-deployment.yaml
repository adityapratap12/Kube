apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-node-preprod
  namespace: pre-prod
  labels:
    app: hello-node
    environment: pre-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-node
      environment: pre-prod
  template:
    metadata:
      labels:
        app: hello-node
        environment: pre-prod
    spec:
      containers:
        - name: hello-node-container
          image: kodekloud/webapp-color:latest
          ports:
            - containerPort: 8080
          env:
            - name: APP_COLOR
              value: "darkblue"
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-node-dev
  namespace: dev
  labels:
    app: hello-node
    environment: development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-node
      environment: development
  template:
    metadata:
      labels:
        app: hello-node
        environment: development
    spec:
      containers:
        - name: hello-node-container
          image: kodekloud/webapp-color:latest
          ports:
            - containerPort: 8080
          env:
            - name: APP_COLOR
              value: "green"
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"

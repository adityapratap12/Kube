apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-node-preprod
  namespace: pre-prod
  labels:
    app: hello-node
    environment: pre-production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-node
      environment: pre-production
  template:
    metadata:
      labels:
        app: hello-node
        environment: pre-production
    spec:
      containers:
        - name: hello-node-container
          image: registry.k8s.io/e2e-test-images/agnhost:2.39
          args: ["netexec", "--http-port=8080"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          env:
            - name: APP_ENV
              value: "pre-production"
